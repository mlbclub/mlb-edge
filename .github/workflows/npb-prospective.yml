name: NPB Prospective Validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'freeze before first pitch, or settle after finals'
        required: true
        default: 'freeze'
        type: choice
        options:
          - freeze
          - settle
      target_date:
        description: 'YYYY-MM-DD. Leave blank on freeze to use next fully pregame NPB date. Required for settle.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-npb:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check prospective validation
        run: python -m py_compile sports_lab/baseball/npb_prospective.py run_npb_prospective.py

      - name: Unit test prospective validation
        run: python -m unittest tests.test_npb_prospective

      - name: Freeze or settle NPB cohort
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "settle" ] && [ -z "${{ inputs.target_date }}" ]; then
            echo "target_date is required for settle"
            exit 2
          fi
          if [ -n "${{ inputs.target_date }}" ]; then
            python run_npb_prospective.py "${{ inputs.mode }}" --date "${{ inputs.target_date }}"
          else
            python run_npb_prospective.py "${{ inputs.mode }}"
          fi

      - name: Save prospective validation snapshot
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/npb/prospective data/npb/games_v2.csv data/npb/game_details_v2.json data/npb/announced_starters_v2.json data/npb/features_v2.csv data/npb/v4_audit/features.csv
          if git diff --cached --quiet; then
            echo "No NPB prospective changes to commit."
          else
            git commit -m "Update NPB prospective validation"
            git push
          fi
