name: Apply baseball market policy

on:
  push:
    branches: [main]
    paths:
      - 'mlb_edge_public_web_designed/scripts/apply_baseball_market_policy.py'
      - 'mlb_edge_public_web_designed/tests/test_ranked_picks.py'
      - '.github/workflows/apply-baseball-market-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlb_edge_public_web_designed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply shared baseball market policy
        run: python scripts/apply_baseball_market_policy.py
      - name: Syntax checks
        run: |
          python -m py_compile sports_lab/baseball/market_policy.py mlb_model/recommend.py sports_lab/baseball/kbo_v2.py sports_lab/baseball/npb.py streamlit_app.py
      - name: Focused tests
        run: python -m unittest tests.test_market_policy tests.test_ranked_picks
      - name: Commit migration
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports_lab/baseball/market_policy.py mlb_model/recommend.py sports_lab/baseball/kbo_v2.py sports_lab/baseball/npb.py streamlit_app.py tests/test_market_policy.py
          if git diff --cached --quiet; then
            echo "No market-policy changes to commit."
          else
            git commit -m "Unify baseball favorite and underdog selection"
            git push
          fi
