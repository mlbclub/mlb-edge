name: Build KBO model

on:
  workflow_dispatch:
  schedule:
    # 12:00 KST/JST daily. Staggered after NPB to avoid simultaneous pushes.
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: kbo-model-main
  cancel-in-progress: false

jobs:
  build-kbo:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check KBO V2 modules
        run: python -m py_compile sports_lab/registry.py sports_lab/baseball/market_policy.py sports_lab/baseball/kbo.py sports_lab/baseball/kbo_v2.py sports_lab/baseball/kbo_starters.py run_kbo_v2_pipeline.py mlb_model/odds.py

      - name: Unit test KBO V2 helpers and shared market policy
        run: |
          python -m unittest tests.test_kbo_v2
          python -m unittest tests.test_market_policy

      - name: Collect and cache official KBO boxscore detail
        run: |
          python - <<'PY'
          from sports_lab.baseball.kbo_v2 import collect_schedule_v2, collect_details_v2
          games = collect_schedule_v2()
          collect_details_v2(games)
          PY

      - name: Checkpoint KBO detail cache
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kbo/games_v2.csv data/kbo/game_details_v2.csv
          if git diff --cached --quiet; then
            echo "No new KBO detail cache."
          else
            git commit -m "Update KBO V2 detail cache"
            git pull --rebase origin main
            git push
          fi

      - name: Train KBO V2 and create today predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_kbo_v2_pipeline.py

      - name: Save KBO V2 model data
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kbo models/kbo
          if git diff --cached --quiet; then
            echo "No new KBO V2 data."
          else
            git commit -m "Update KBO V2 model data"
            git pull --rebase origin main
            git push
          fi
