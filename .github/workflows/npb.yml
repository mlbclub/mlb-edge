name: Build NPB model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npb-model-main
  cancel-in-progress: false

jobs:
  build-npb:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check NPB modules
        run: python -m py_compile sports_lab/baseball/npb.py sports_lab/baseball/npb_details.py sports_lab/baseball/npb_v2.py run_npb_v2_pipeline.py

      - name: Unit test NPB helpers
        run: python -m unittest discover -s tests -p 'test_npb*.py'

      - name: Restore official NPB page cache
        uses: actions/cache@v4
        with:
          path: mlb_edge_public_web_designed/data/npb/official_cache
          key: npb-official-v2-${{ github.run_id }}
          restore-keys: npb-official-v2-

      - name: Collect NPB data, train model and create today predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_npb_v2_pipeline.py

      - name: Preserve NPB diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npb-v2-diagnostics
          path: |
            mlb_edge_public_web_designed/data/npb/*report*
            mlb_edge_public_web_designed/data/npb/v2_*.json
            mlb_edge_public_web_designed/data/npb/v2_*.csv

      - name: Save NPB model data
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/npb models/npb
          if git diff --cached --quiet; then
            echo "No new NPB data."
          else
            git commit -m "Update NPB V2 evaluation and operating predictions"
            git push
          fi
