name: Build EPL V2 model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mlb_edge_public_web_designed/sports_lab/soccer/epl_v2.py'
      - 'mlb_edge_public_web_designed/run_epl_v2_pipeline.py'
      - 'mlb_edge_public_web_designed/tests/test_epl_v2.py'
      - '.github/workflows/epl-v2.yml'

permissions:
  contents: write

concurrency:
  group: epl-v2-main
  cancel-in-progress: false

jobs:
  build-epl-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mlb_edge_public_web_designed
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check EPL V2
        run: python -m py_compile sports_lab/soccer/epl_v2.py run_epl_v2_pipeline.py
      - name: Unit tests EPL V2
        run: python -m unittest tests.test_epl_v2
      - name: Collect EPL data, validate and build V2
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_epl_v2_pipeline.py
      - name: Save EPL V2 audit artifacts
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/soccer/epl models/soccer/epl
          if git diff --cached --quiet; then
            echo "No EPL V2 artifacts changed."
          else
            git commit -m "Update EPL V2 validation artifacts"
            git pull --rebase origin main
            git push
          fi
