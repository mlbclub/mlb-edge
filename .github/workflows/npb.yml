name: Build NPB model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-npb:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check NPB modules
        run: python -m py_compile sports_lab/registry.py sports_lab/baseball/npb.py run_npb_pipeline.py mlb_model/odds.py

      - name: Unit test NPB helpers
        run: python -m unittest tests.test_npb

      - name: Collect NPB data, train model and create today predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_npb_pipeline.py

      - name: Save NPB model data
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/npb models/npb
          if git diff --cached --quiet; then
            echo "No new NPB data."
          else
            git commit -m "Update NPB model data"
            git push
          fi
