name: Update MLB model data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore MLB boxscore cache
        uses: actions/cache@v4
        with:
          path: mlb_edge_public_web_designed/data/boxscores
          key: mlb-boxscores-${{ github.run_id }}
          restore-keys: |
            mlb-boxscores-

      - name: Collect MLB data and train model
        run: python run_pipeline.py

      - name: Save updated model to GitHub
        run: |
          git config user.name "mlb-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv models/*.joblib models/*.json || true

          if git diff --cached --quiet; then
            echo "No new MLB model data."
          else
            git commit -m "Update MLB model data"
            git push
          fi
