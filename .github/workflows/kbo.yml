name: Build KBO model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kbo:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check KBO modules
        run: python -m py_compile sports_lab/registry.py sports_lab/baseball/kbo.py run_kbo_pipeline.py mlb_model/odds.py

      - name: Collect KBO data and train model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_kbo_pipeline.py

      - name: Save KBO model data
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kbo models/kbo
          if git diff --cached --quiet; then
            echo "No new KBO data."
          else
            git commit -m "Update KBO model data"
            git push
          fi
