name: Nightly KBO NPB results refresh

on:
  schedule:
    # 23:50 KST/JST every day (14:50 UTC)
    - cron: '50 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-baseball-results-main
  cancel-in-progress: false

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh KBO official final scores and boxscore details only
        run: |
          python - <<'PY'
          from sports_lab.baseball.kbo_v2 import collect_schedule_v2, collect_details_v2
          games = collect_schedule_v2()
          collect_details_v2(games)
          PY

      - name: Refresh NPB official final scores and boxscore details only
        run: |
          python - <<'PY'
          from sports_lab.baseball.npb_details import collect_games, collect_details
          games = collect_games()
          collect_details(games)
          PY

      - name: Save nightly final results
        run: |
          git config user.name "sports-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/kbo/games_v2.csv \
            data/kbo/game_details_v2.csv \
            data/npb/games_v2.csv \
            data/npb/game_details_v2.json \
            data/npb/detail_collection_report.json
          if git diff --cached --quiet; then
            echo "No new KBO/NPB final results."
          else
            git pull --rebase origin main
            git commit -m "Refresh nightly KBO and NPB final results"
            git push
          fi
