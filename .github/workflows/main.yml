name: Update MLB model data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: mlb_edge_public_web_designed

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mlb_edge_public_web_designed/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore MLB boxscore cache
        uses: actions/cache@v4
        with:
          path: mlb_edge_public_web_designed/data/boxscores
          key: mlb-boxscores-${{ github.run_id }}
          restore-keys: |
            mlb-boxscores-

      - name: Archive current odds snapshot
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python snapshot_current_odds.py

      - name: Test robust selection and live compatibility
        run: python -m unittest discover -s tests -v

      - name: Collect MLB data and train designated compact core model
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python run_pipeline.py

      - name: Cross-check bullpen roles against active MLB rosters
        continue-on-error: true
        run: python -m mlb_model.bullpen_roles

      - name: Generate current KST predictions and recommendations
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OMP_NUM_THREADS: '2'
        run: python predict_today.py

      - name: Save updated model to GitHub
        run: |
          git config user.name "mlb-edge-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/mlb_games_2024_2026.csv
          git add data/mlb_games_enriched.csv
          git add data/team_game_stats.csv
          git add data/features_v3.csv
          git add models/market_model_v3.joblib
          git add data/robust_ablation_report.csv
          git add data/today_market_predictions.csv
          git add data/reliever_appearances.csv

          for f in \
            data/bullpen_roles.csv \
            data/current_odds_history.csv \
            data/pitcher_meta.csv \
            data/venue_meta.csv \
            data/park_factors_context.csv \
            data/game_pregame_context.csv \
            data/ablation_report.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new MLB model data."
          else
            git commit -m "Update MLB model data"
            git push
          fi
